<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portada con Fondo de Tecnología</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/427/427735.png" type="image/png">
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url('fondo.JPG') no-repeat center center fixed;
      background-size: cover;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      animation: fadeIn 2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .portada {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .portada h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .portada h2 {
      font-weight: normal;
      margin-bottom: 30px;
    }

    .portada p {
      font-size: 1.1em;
    }

    .boton-entrar {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1em;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #007bff;
    }

    .boton-entrar:hover {
      background-color: #0056b3;
      box-shadow: 0 0 20px #00f7ff, 0 0 30px #00f7ff;
    }

    header.menu {
      text-align: center;
    }

    header.menu nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    header.menu nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="portada">
    <h1>Mi Proyecto Final</h1>
    <h2>Historia de la Tecnología</h2>
    <p>Presentado por: Ebidio Pérez</p>
    <p>Cédula: 5-718-527</p>
    <p>Fecha: Julio 2025</p>
    <a href="pagina2.html">
      <button class="boton-entrar">Entrar al proyecto</button>
    </a>
  </div>

  <!-- Menú de navegación -->
  <header class="menu">
    <nav>
      <a href="index.html" target="_blank">Portada</a>
      <a href="pagina2.html" target="_blank">Historia de la Tecnología</a>
      <a href="edad de piedra.html" target="_blank">Edad de Piedra</a>
      <a href="edad de los metales.html" target="_blank">Edad de los Metales</a>
      <a href="edad media.html" target="_blank">Edad Media</a>
    </nav>
  </header>

</body>
</html>
